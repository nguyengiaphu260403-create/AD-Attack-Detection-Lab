### 16.7 Credential Dump File — Sysmon Event 11

```yaml
title: Potential Credential Dump File Created
id: 3a2d3e76-4d9f-42d5-a6a2-credential-dump
status: experimental
description: Detects creation of files whose names suggest credential dumping.
author: Blue Team Lab
date: 2026/10/08
tags:
  - attack.credential-access
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 11
    TargetFilename|re:
      - '(?i)\\lsass.*\.dmp$'
      - '(?i)\\sam.*\.dmp$'
      - '(?i)\\security.*\.dmp$'
      - '(?i)\\ntds.*\.dmp$'
  condition: selection
falsepositives:
  - Authorized forensic acquisition
  - Crash dumps
level: high
```
