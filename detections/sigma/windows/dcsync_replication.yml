### 16.8 DCSync — Directory Replication Rights

ATT&CK: `T1003.006`

```yaml
title: Potential DCSync Directory Replication Request
id: 7e0e0a44-7d4b-4c4a-b9b1-dcsync
status: experimental
description: Detects Event 4662 containing AD replication extended rights associated with DCSync.
author: Blue Team Lab
date: 2026/10/08
tags:
  - attack.credential-access
  - attack.t1003.006
logsource:
  product: windows
  service: security
detection:
  selection_event:
    EventID: 4662
  selection_replication:
    Properties|contains:
      - '1131f6aa-9c07-11d1-f79f-00c04fc2dcd2'
      - '1131f6ad-9c07-11d1-f79f-00c04fc2dcd2'
      - '89e95b76-444d-4c62-991a-0facbeda640c'
  filter_machine:
    SubjectUserName|endswith: '$'
  condition: selection_event and selection_replication and not filter_machine
falsepositives:
  - Legitimate DC replication
  - Identity synchronization
  - Backup/migration infrastructure
level: high
```

**Prerequisite:** 4662 chỉ có giá trị nếu Directory Service Access auditing và SACL trên domain object được cấu hình đúng. Tuning thêm source IP/host và replication infrastructure allowlist.
