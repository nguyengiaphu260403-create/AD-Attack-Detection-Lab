### 16.3 Service Account Network Logon

```yaml
title: Service Account Network Logon
id: 2c8a2e10-6f3e-46b8-a1c2-service-logon
status: experimental
description: Detects network logons by a known service account for lateral-movement correlation.
author: Blue Team Lab
date: 2026/10/08
tags:
  - attack.lateral-movement
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4624
    LogonType: 3
    TargetUserName: 'svc_web'
  condition: selection
falsepositives:
  - Expected service-to-service communication
  - Backup/monitoring
  - Administration
level: low
```

Production nên thay `svc_web` bằng lookup service-account và allowlist source/destination.
